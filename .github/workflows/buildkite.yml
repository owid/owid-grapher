name: Buildkite

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  destroy_staging:
    runs-on: ubuntu-latest # Docker-based action; ubuntu-slim has no Docker
    steps:
      - name: Trigger staging destroy pipeline
        uses: buildkite/trigger-pipeline-action@v2.5.1
        with:
          buildkite_api_access_token: ${{ secrets.BUILDKITE_API_ACCESS_TOKEN }}
          pipeline: our-world-in-data/grapher-destroy-staging-environment
          branch: master
          commit: HEAD
          message: Triggered build via Github action in owid-grapher repository
          send_pull_request: false
          build_env_vars: '{"BRANCH": ${{ toJSON(github.event.pull_request.head.ref) }}}'
