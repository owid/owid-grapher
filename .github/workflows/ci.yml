name: CI
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Checks for prettify errors, TypeScript errors and runs vitest tests.
  "test-db":
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps

      - name: Install dependencies
        run: cp .env.example-grapher .env
        shell: bash

      - name: Build and run db tests
        run: make dbtest
        timeout-minutes: 6

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps

      - name: Run vitest
        run: yarn test --pool=forks

  admin-playwright:
    runs-on: ubuntu-latest

    # Each shard starts its own test database and admin server
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps

      - name: Configure test environment
        run: cp .env.example-grapher .env

      - name: Install Chromium
        run: yarn playwright install --with-deps --no-shell chromium

      - name: Run admin Playwright tests
        run: yarn testPlaywrightAdmin --shard=${{ matrix.shard }}/3
        timeout-minutes: 12

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps
        with:
          runPostinstallScripts: false

      - name: Run typecheck
        run: yarn typecheck

  format:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps
        with:
          runPostinstallScripts: false

      - name: Check formatting
        run: yarn testFormatAll

  oxlint:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps
        with:
          runPostinstallScripts: false

      - name: Run oxlint
        run: yarn testLint

  raycast-snippets:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps
        with:
          runPostinstallScripts: false

      - name: Check Raycast snippets are in sync
        run: yarn checkRaycastSnippets

  # The committed gdocs registries are derived from the .md sidecars + type
  # definitions. The generator exits non-zero on invalid sidecars/examples,
  # so that step covers "invalid"; the diff check covers "stale".
  gdocs-references:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps
        with:
          runPostinstallScripts: false

      - name: Regenerate gdocs references
        run: yarn generateGdocsReferences

      # Checks whatever the generator wrote, rather than a hardcoded list:
      # --porcelain also reports an untracked file, so a newly added registry
      # is covered without editing this job.
      - name: Check committed registries are current
        run: |
          changed=$(git status --porcelain -- 'packages/@ourworldindata/types/src/gdocTypes/*.registry.generated.json')
          if [ -n "$changed" ]; then
            git diff -- 'packages/@ourworldindata/types/src/gdocTypes/*.registry.generated.json'
            echo "$changed"
            echo "::error::packages/@ourworldindata/types/src/gdocTypes/*.registry.generated.json are stale or uncommitted. Run 'yarn generateGdocsReferences' and commit the result."
            exit 1
          fi

  # Publishes the writing reference as a Google Doc so authors (and the Claude
  # for Google Workspace sidebar) have an always-current copy. Runs only on
  # master, after the registries were checked current; never on PRs or forks.
  publish-gdocs-reference-doc:
    runs-on: ubuntu-latest
    needs: gdocs-references
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'owid/owid-grapher'
    # One publisher at a time against the shared doc; a queued run still publishes
    concurrency:
      group: publish-gdocs-reference-doc
      cancel-in-progress: false

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps
        with:
          runPostinstallScripts: false

      - name: Publish the reference Google Doc
        run: yarn buildGdocsReferenceDoc
        env:
          GDOCS_REFERENCE_DOCUMENT_ID: ${{ secrets.GDOCS_REFERENCE_DOCUMENT_ID }}
          GDOCS_CLIENT_EMAIL: ${{ secrets.GDOCS_CLIENT_EMAIL }}
          GDOCS_PRIVATE_KEY: ${{ secrets.GDOCS_PRIVATE_KEY }}

  # Runs `bundlemon` on the code to see if our Vite build assets exceed a given file size.
  bundlemon:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps

      - name: Build
        run: yarn buildViteSite
        env:
          BUNDLEMON: true

      - name: BundleMon
        uses: lironer/bundlemon-action@4b47df0793e18e3899eeb07f19b7c88c92c2490e # v1.4.0

  zizmor:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          # Avanced Security mode is a bit too complicated for our use case, but
          # we might want to switch to it in the future.
          advanced-security: false
