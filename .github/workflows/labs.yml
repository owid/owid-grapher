# Rebuilds the `labs` branch (master plus every open PR labelled `labs`) whenever
# one of its inputs changes. Pushing `labs` is what deploys Labs, the staff-only
# copy of the site: its draft PR gets a staging server like any other.
# See devTools/labs/rebuild-labs-branch.sh.
name: Rebuild Labs

on:
  push:
    branches: [master]
  # pull_request_target runs this file from master, never a PR's version of it,
  # with write access and secrets. The script only takes PRs from branches of
  # this repo (never forks), whose authors can already push here.
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, closed]
  workflow_dispatch:

# Every run rebuilds from scratch, so only the newest one matters. A running
# rebuild is left to finish, so an agent resolving a conflict isn't cut off by
# the next push; GitHub keeps only the newest of the waiting runs.
concurrency:
  group: labs-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.label.name == 'labs' ||
      contains(github.event.pull_request.labels.*.name, 'labs')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      # Node and yarn to typecheck conflict resolutions; dependencies are
      # installed by the script only when a merge needs it
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.308

      # Conflict resolutions recorded by git rerere, replayed on later rebuilds
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/rr-cache
          key: labs-rerere-${{ github.run_id }}
          restore-keys: labs-rerere-

      - name: Rebuild and push labs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.LABS_ANTHROPIC_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          devTools/labs/rebuild-labs-branch.sh
