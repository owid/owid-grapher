name: Project automations
on:
  issues:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
  pull_request:
    types:
      - opened
      - reopened
      - review_requested
      - closed

permissions: {}

jobs:
  prio:
    name: Sync issue priority to project board
    runs-on: ubuntu-slim
    steps:
      - uses: owid/actions/assign-priority@main
        with:
          PROJECT_ISSUES_TOKEN: ${{ secrets.PROJECT_ISSUES_TOKEN }}
  status:
    name: Set status based on event
    runs-on: ubuntu-slim
    steps:
      - uses: owid/actions/set-project-status@main
        with:
          PROJECT_ISSUES_TOKEN: ${{ secrets.PROJECT_ISSUES_TOKEN }}
  needs_triage:
    name: Add "needs triage" label
    runs-on: ubuntu-slim
    if: github.event_name == 'issues' && github.event.action == 'opened'
    permissions:
      issues: write
    steps:
      - name: Label issue
        uses: andymckay/labeler@1.0.4
        with:
          add-labels: "needs triage"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
  staging_viz:
    name: Add "staging-viz" label to Sophia's PRs
    runs-on: ubuntu-slim
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.actor == 'sophiamersmann'
    permissions:
      pull-requests: write
    steps:
      - uses: andymckay/labeler@1.0.4
        with:
          add-labels: "staging-viz"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
  site_label:
    name: Add "site" label to site team's issues
    runs-on: ubuntu-slim
    # To have your own new issues labelled "site", add your GitHub handle to
    # the list below.
    if: >
      github.event_name == 'issues' && github.event.action == 'opened' &&
      contains(fromJSON('["mlbrgl"]'), github.actor)
    permissions:
      issues: write
    steps:
      - uses: andymckay/labeler@1.0.4
        with:
          add-labels: "site"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
