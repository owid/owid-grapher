name: Upload to R2
on:
  push:
    branches:
      - master
    paths:
      - "packages/@ourworldindata/grapher/src/schema/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps

      - uses: hustcer/setup-nu@ccd5bb5426b05a32009c2ba967946231f3919c97 # v3.25
        with:
          version: "0.101" # Don't use 0.101 here, as it was a float number and will be convert to 0.101, you can use v0.101/0.101.0 or '0.101'
      # Turn all yaml files in the schema directory into json (should only be one)
      - run: |
          (ls packages/@ourworldindata/grapher/src/schema/*.yaml
          | each {|yaml|
              open $yaml.name
              | to json
              | save -f ($yaml.name
                  | path parse
                  | upsert extension "json"
                  | path join) })
        shell: nu {0}
      # Construct default config objects for all grapher schemas in the schema directory (should only be one)
      - run: |
          (ls packages/@ourworldindata/grapher/src/schema/grapher-schema.*.json
          | each {|json|
              yarn tsx --tsconfig tsconfig.tsx.json devTools/schema/generate-default-object-from-schema.ts $json.name
              | save -f ($json.name
                  | path parse
                  | upsert stem ($json.name
                      | path parse
                      | get stem
                      | str replace 'grapher-schema' 'grapher-schema.default')
                  | path join) })
        shell: nu {0}
      # Get all files in the schema directory that end with digits.json or digits.yaml and
      # copy them to a file called .latest.json or .latest.yaml
      - run: |
          ( ls packages/@ourworldindata/grapher/src/schema/*
             | where name =~ '\d+.(json|yaml)$'
             | get name
             | each { |it| cp $it ($it | str replace -r '\d+.(json|yaml)$' 'latest.$1') })
        shell: nu {0}
      - run: ls packages/@ourworldindata/grapher/src/schema
        shell: nu {0}
      # Now upload all files in that folder to Cloudflare R2.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync packages/@ourworldindata/grapher/src/schema s3://owid-public/schemas \
            --endpoint-url https://${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      # The etl repo vendors this schema and its integration tests compare the vendored copy
      # against the published one, so until etl re-vendors, every etl branch's staging build
      # fails on a change made here. Telling etl the moment we publish gets its sync PR opened
      # in minutes; it also polls daily, but that left a Friday publish red until Monday.
      # Needs a token with contents:write on owid/etl — GITHUB_TOKEN cannot dispatch across
      # repos. A failure here must not fail the upload that already succeeded.
      - name: Tell owid/etl the schema was published
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ETL_SCHEMA_SYNC_TOKEN }}
        run: |
          gh api repos/owid/etl/dispatches --input - <<EOF
          {
            "event_type": "grapher-schema-published",
            "client_payload": { "commit": "$GITHUB_SHA" }
          }
          EOF
