name: Grapher package

# Builds the standalone @ourworldindata/grapher npm package / CDN bundle and
# runs the smoke tests in packages/@ourworldindata/grapher/packageTest/
# against the build outputs: importability of both JS builds, mounting a
# chart from the built code, and typechecking the packed type declarations.
# Does the same for @ourworldindata/grapher-editor, whose sources live in
# adminSiteClient/.
on:
  pull_request:
    paths:
      - "packages/@ourworldindata/**"
      - "adminSiteClient/**"
      - "adminShared/**"
      - "tsconfig.editor-dts.json"
      - "rolldown.config-common.mts"
      - "yarn.lock"
      - ".github/workflows/grapher-package.yml"
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [grapher, grapher-editor]
    name: test-package (${{ matrix.package }})
    defaults:
      run:
        working-directory: packages/@ourworldindata/${{ matrix.package }}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-yarn-deps

      - name: Build package
        run: yarn build

      - name: Test package
        run: yarn testPackage
