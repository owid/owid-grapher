<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Our World in Data, in columns</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <header class="bar">
            <div class="bar__history">
                <button
                    class="icon-button"
                    data-action="back"
                    aria-label="Back"
                    title="Back (⌫)"
                >
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M10 3 5 8l5 5" />
                    </svg>
                </button>
                <button
                    class="icon-button"
                    data-action="forward"
                    aria-label="Forward"
                    title="Forward (⇧⌫)"
                >
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="m6 3 5 5-5 5" />
                    </svg>
                </button>
                <button
                    class="icon-button"
                    data-action="palette"
                    aria-label="Search and actions"
                    title="Search and actions (⌘K)"
                >
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path
                            d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9ZM10.3 10.3 13.5 13.5"
                        />
                    </svg>
                </button>
            </div>
            <nav class="crumbs" aria-label="Where you are"></nav>
            <nav class="tramline" aria-label="Places you visited" hidden></nav>
        </header>
        <main class="strip" tabindex="0" aria-label="Site, in columns"></main>
        <footer class="keys"></footer>
        <dialog class="palette" aria-label="Search and actions">
            <div class="palette__field">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path
                        d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9ZM10.3 10.3 13.5 13.5"
                    />
                </svg>
                <input
                    type="text"
                    placeholder="Search the site, or pick an action"
                    aria-label="Search the site, or pick an action"
                    autocomplete="off"
                    spellcheck="false"
                />
            </div>
            <div class="palette__list" role="listbox"></div>
        </dialog>
        <script type="module" src="./app.ts"></script>
    </body>
</html>
