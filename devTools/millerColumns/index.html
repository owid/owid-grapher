<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Our World in Data, in columns</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <header class="bar">
            <div class="bar__history">
                <button
                    class="icon-button"
                    data-action="home"
                    aria-label="Home"
                    title="Home"
                >
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M2 4h4.5L8 5.5h6V13H2z" />
                    </svg>
                </button>
                <button
                    class="icon-button"
                    data-action="back"
                    aria-label="Back"
                    title="Back (⌫)"
                >
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M10 3 5 8l5 5" />
                    </svg>
                </button>
                <button
                    class="icon-button"
                    data-action="forward"
                    aria-label="Forward"
                    title="Forward (⇧⌫)"
                >
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="m6 3 5 5-5 5" />
                    </svg>
                </button>
            </div>
            <div class="omnibox" data-mode="search">
                <div class="omnibox__field">
                    <svg class="icon omnibox__icon" aria-hidden="true"></svg>
                    <span class="omnibox__tags"></span>
                    <input
                        class="omnibox__input"
                        type="text"
                        role="combobox"
                        aria-label="Search, or type > for commands"
                        aria-controls="omnibox-menu"
                        aria-expanded="false"
                        aria-autocomplete="list"
                        autocomplete="off"
                        spellcheck="false"
                    />
                    <span class="omnibox__offer"></span>
                    <kbd class="omnibox__key">/</kbd>
                </div>
                <div
                    class="omnibox__menu"
                    id="omnibox-menu"
                    role="listbox"
                    hidden
                ></div>
                <div class="omnibox__suggest" hidden></div>
            </div>
            <nav class="tramline" aria-label="Places you visited" hidden></nav>
        </header>
        <nav class="crumbs" aria-label="Where you are"></nav>
        <main class="strip" tabindex="0" aria-label="Site, in columns"></main>
        <footer class="keys"></footer>
        <script type="module" src="./app.ts"></script>
    </body>
</html>
