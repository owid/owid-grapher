metadata:
  description: |
    The history of chart editor saves for each standalone chart, for charts published at https://ourworldindata.org/grapher/SLUG.

    Each row holds the chart's admin patch (the chart_configs row named by charts.patchConfigId) as a save from the chart editor left it. ETL pushes and detaches add no rows, even when they rewrite the patch, so a chart's latest row can lag its patch. The chart editor's Revisions tab lists these rows.

    Older rows don't always follow this:
        - Some charts' latest row lags their patch, because config migrations rewrote chart_configs without rewriting chart_revisions.
        - Rows from before 2024-09 hold full configs rather than patches.
        - Some rows were written by ETL pushes that changed the rendered chart.

    Config migrations rewrite `config` in place, so rows stay readable against the current schema.

fields:
  id:
    description: Unique identifier for the chart revision
  chartId:
    description: Foreign key to charts table. The chart this revision belongs to.
  userId:
    description: Foreign key to users table. The user who created this revision.
  config:
    description: |
      The chart's admin patch after the change this row records (chart_configs.config of the row named by charts.patchConfigId, not the merged config).

      The full schema is available at 'https://files.ourworldindata.org/schemas/grapher-schema.latest.json'. For querying chart contents, the most important fields are:
          - title
          - subtitle
          - chartTypes: array of string enums with valid values: ScatterPlot, StackedArea, DiscreteBar, StackedDiscreteBar, SlopeChart, StackedBar, Marimekko. Indicates which of these chart tabs are enabled for the chart.
          - hasMapTab: Whether the map tab is enabled
          - isPublished: whether the chart is published, if it is a standalone chart (i.e. a chart referenced from the charts table)
  createdAt:
    description: Timestamp when the revision was created
  updatedAt:
    description: Timestamp when the revision was last updated
