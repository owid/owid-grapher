metadata:
  description: Many-to-many table linking multi-dimensional charts/data pages to their chart configurations. The viewId is the identifier of a specific view that is basically the combination of all drop-down values the user selected to identify the view they are interested in.
  incoming_foreign_keys:
    - table: narrative_charts
      column: parentMultiDimXChartConfigId
fields:
  id:
    description: Unique identifier for the configuration
  multiDimId:
    description: Foreign key to multi_dim_data_pages table
  viewId:
    description: |
      Canonical view identifier derived from the dimensions object using
      sorted key=value pairs.
  variableId:
    description: Foreign key to variables table for the variable being visualized
  chartConfigId:
    description: Foreign key to chart_configs table for the config that is rendered for this view (the merge of the indicator config and the view's patch)
  patchConfigId:
    description: Foreign key to chart_configs table for the view config as authored in the mdim YAML (the mdim-wide config composed with this view's own config). Read whenever the view has to be re-merged, e.g. after an indicator config change.
  createdAt:
    description: Timestamp when the configuration was created
  updatedAt:
    description: Timestamp when the configuration was last updated
