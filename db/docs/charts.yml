metadata:
  description: This table contains our 'standalone' grapher charts, i.e. the charts that are shown on our website at https://ourworldindata.org/grapher/SLUG. Charts represent data visualizations that can be embedded in articles, shared publicly, or used in explorers. Charts use an inheritance system where they can inherit configuration from parent variables.
  incoming_foreign_keys:
    - table: chart_diff_approvals
      column: chartId
    - table: chart_diff_conflicts
      column: chartId
    - table: chart_dimensions
      column: chartId
    - table: chart_slug_redirects
      column: chart_id
    - table: chart_tags
      column: chartId
    - table: charts_x_entities
      column: chartId
    - table: explorer_charts
      column: chartId
    - table: narrative_charts
      column: parentChartId
    - table: related_charts
      column: chartId
    - table: related_charts
      column: relatedChartId
fields:
  id:
    description: |
      Internal auto-increment identifier for the chart. Note that these ids are minted independently per environment (production, staging servers, dev machines), so the same numeric id can refer to different charts on different servers. For referencing charts from external systems, prefer the chart's config UUID (see configId).
  configId:
    description: |
      Foreign key to chart_configs, pointing at the config that is actually rendered (the merge of the indicator layers and this chart's patch). chart_configs holds that config, the chart's slug etc., so many queries have to join the two — this is the pointer you want unless you specifically need what a user authored.

      It is also the chart's stable external identity, and the preferred identifier for external references: a client-generated UUIDv7, unique per chart, assigned once at creation and — by invariant — never changed, since chart updates modify the chart_configs row in place rather than swapping it. Replacing that row would break the invariant and must not be done. Unlike the numeric id it does not collide across environments (database copies keep the same UUIDs, and chart-sync carries it across servers), and unlike the slug it exists for unpublished charts. The admin API accepts it wherever a :chartId route param is expected.
  patchConfigId:
    description: Foreign key to chart_configs table, pointing at the layer authored in the chart editor, i.e. the changes made on top of the inherited indicator config. Equals the rendered config when inheritance is disabled. Written together with configId in a single transaction, and only read when reopening the editor or re-merging after an indicator config change.
  patchConfigIdETL:
    description: |
      Foreign key to chart_configs table, holding the chart's ETL-authored config layer, if any — mirroring variables.patchConfigIdETL, but per chart rather than per indicator. Like patchConfigId it names an authored layer, never a config that renders. The rendered config a chart displays (configId's row) is merge(indicator config, this row's config, patchConfigId's row) — admin edits always win. NULL until the ETL first pushes a config for this chart.
  etlConfigCatalogPath:
    description: |
      The ETL step that authored this chart's ETL config layer (patchConfigIdETL), i.e. the step that currently owns the chart, in ETL catalog-path form (`namespace/version/step#indicator`), mirroring multi_dim_data_pages.catalogPath. NULL for hand-authored charts and for ETL charts predating this column. Set from the `catalogPath` query param of the ETL config push route.

      This is not an identifier: a chart is identified by its config UUID (configId), which never changes, whereas the catalog path may change when a step is renamed or moved. It exists so the ETL can sanity-check whether a chart has already been adopted — never to resolve which chart a push is for.

      Enforced unique at the DB level (one chart per catalog path): a push carrying a different path updates it, while one claiming a path already used by another chart is rejected with a 409 rather than a raw duplicate-key error. Malformed paths get a 400 (the same path shape the multi-dim routes enforce).
  isInheritanceEnabled:
    description: When true, chart inherits configuration from parent variable's patchConfigIdETL. This allows variables to define default chart settings that are automatically applied to all inheriting charts.
  forceDatapage:
    description: When true, force rendering this chart as a data page using metadata from the first Y indicator.
  createdAt:
    description: Timestamp when the chart was created
  updatedAt:
    description: Timestamp when the chart was last updated
  lastEditedAt:
    description: Timestamp when the chart was last edited by a user (not system updates)
  publishedAt:
    description: Timestamp when the chart was published. NULL if never published. Published charts are publicly accessible.
  lastEditedByUserId:
    description: Foreign key to users table. Tracks who last made substantive edits to the chart.
  publishedByUserId:
    description: Foreign key to users table. Tracks who published the chart.
