openapi: 3.0.4
info:
  title: Search API
  version: 0.1.0
  description: |
    Search API for accessing Our World in Data charts and content pages powered by Algolia.

    This API allows you to search through:

    - **Charts**: Interactive data visualizations with country-specific filtering
    - **Pages**: Articles, data insights, and other content pages (filter by type via `pageTypes`)
    - **Topics**: The topic pages to recommend for a query, as on the site's search page
    - **Profiles**: Country profiles

    !!! tip "Semantic Search"

        We also offer semantic search for indicators via the [Data API](../data/index.md#indicator-search). This allows natural language queries like "deaths from air pollution" to find relevant indicators.
  contact:
    name: Our World in Data
    url: https://ourworldindata.org
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/

servers:
  - url: https://ourworldindata.org/api
    description: Site API

paths:
  /search:
    get:
      summary: Search for charts, pages or topics
      description: |
        Search through Our World in Data's collection of charts and pages.

        - For **chart search**: Filter by countries, topics, and entity availability
        - For **page search**: Find articles, research papers, and informational content
        - For **topic recommendations**: Find the topic pages a query is about
        - For **profile search**: Find country profiles

        Parameters not listed below are ignored, and named in the response's
        `warnings` field (except `utm_*` tracking tags). So are parameters the
        chosen `type` doesn't read, such as `pageTypes` with `type=topics` or
        `requireAllCountries` with `type=pages`. In particular, the
        search page's `resultType` parameter isn't read here: use `type=pages`
        to search writing.
      operationId: search
      tags:
        - Search
      parameters:
        - name: q
          in: query
          description: |
            Search query text, of up to 512 bytes (Algolia's limit; longer
            queries return a 400)
          required: false
          schema:
            type: string
            default: ""
          example: "population"

        - name: type
          in: query
          description: |
            Type of content to search. `charts` and `pages` are text searches.

            `topics` recommends topic pages: with a query, they are the topics of
            the best-ranked charts matching it, weighted by rank, so `q=gdp`
            leads with the Economic Growth page. `countries`, `topics` and
            `requireAllCountries` apply to that chart search. Without a query,
            or when no chart matches, topic pages are searched by their own
            text, filtered by `topics`; `countries` and
            `requireAllCountries` don't apply there. Topic pages come in two layouts (a
            result's `type` is `topic-page` or `linear-topic-page`), and both
            are returned. `closestMatches` is never set on a `topics` response.

            `profiles` searches country profiles by their text, filtered by
            `countries` and `topics`.
          required: false
          schema:
            type: string
            enum:
              - charts
              - pages
              - topics
              - profiles
            default: charts
          example: "charts"

        - name: page
          in: query
          description: Page number for pagination (0-indexed)
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 0
          example: 0

        - name: hitsPerPage
          in: query
          description: Number of results per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20

        - name: offset
          in: query
          description: |
            Index of the first result to return. Only applicable when
            `type=pages`, `type=topics` or `type=profiles`, where it takes
            precedence over `page`. Defaults to `page × hitsPerPage`. Lets
            consecutive requests use different page sizes without skipping
            results.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100000
          example: 0

        - name: length
          in: query
          description: |
            Number of results to return. Only applicable when `type=pages`,
            `type=topics` or `type=profiles`, where it takes precedence over
            `hitsPerPage`. Defaults to `hitsPerPage`.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10

        - name: highlights
          in: query
          description: |
            If `true`, results keep Algolia's `objectID`, `_highlightResult`
            and `_snippetResult` fields, which mark where the query matched
            (the site's search page uses them), and any other field starting
            with `_` that Algolia returns, such as `_rankingInfo`. Otherwise
            those fields are removed.
          required: false
          schema:
            type: boolean
            default: false
          example: false

        # Chart-specific parameters
        - name: countries
          in: query
          description: |
            Country names separated by `~` (tilde). Charts and profiles must
            mention any of them (all of them with `requireAllCountries`);
            pages must mention all of them in their title, tags or authors. With `type=topics`,
            they filter the chart search behind the recommendations. At most 50
            filter values in total across `countries`, `topics` and the
            dataset parameters, of up to 200 characters each.
          required: false
          schema:
            type: string
          example: "United States~China"

        - name: topics
          in: query
          description: |
            Topic names separated by `~` (tilde); results must be tagged with
            at least one of them. A name that isn't a topic returns a 400 when nothing
            matches.

            [View all available topics](https://datasette-public.owid.io/owid/tags?slug__notnull=1&_sort=createdAt)
          required: false
          schema:
            type: string
          example: "Health~Vaccination"

        - name: requireAllCountries
          in: query
          description: |
            If `true`, only return results that include ALL specified countries.
            Only applicable when `type=charts`, `type=topics` or `type=profiles`
            and the `countries` parameter is provided.
          required: false
          schema:
            type: boolean
            default: false
          example: false

        - name: datasetProducts
          in: query
          description: |
            Dataset product names separated by `~` (tilde); charts must come
            from one of them. Only applicable when `type=charts`.
            `datasetNamespaces`, `datasetVersions` and `datasetProducers`
            filter the same way.
          required: false
          schema:
            type: string
          example: "World Development Indicators"

        - name: datasetNamespaces
          in: query
          description: Dataset namespaces separated by `~` (tilde). Only applicable when `type=charts`.
          required: false
          schema:
            type: string

        - name: datasetVersions
          in: query
          description: Dataset versions separated by `~` (tilde). Only applicable when `type=charts`.
          required: false
          schema:
            type: string

        - name: datasetProducers
          in: query
          description: Dataset producers separated by `~` (tilde). Only applicable when `type=charts`.
          required: false
          schema:
            type: string

        # Pages-specific parameters
        - name: pageTypes
          in: query
          description: |
            Comma-separated list of page content types to search. Only applicable
            when `type=pages`. Defaults to `article,about-page` when omitted.

            This is a text search whatever types are requested, topic pages
            included, and each type is matched as named: `topic-page` and
            `linear-topic-page` are the two layouts of topic page, so ask for
            both to get every topic page. To find the topic pages a query is
            about, use `type=topics`.
          required: false
          schema:
            type: string
            default: "article,about-page"
          example: "data-insight"

      responses:
        "200":
          description: Successful search response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ChartSearchResponse"
                  - $ref: "#/components/schemas/PageSearchResponse"
              examples:
                chartSearch:
                  summary: Chart search
                  x-schema-ref: "#/components/schemas/ChartSearchResponse"
                  x-request-params:
                    q: "gdp"
                  value:
                    query: "gdp"
                    results:
                      - title: "GDP per capita"
                        slug: "gdp-per-capita-worldbank"
                        subtitle: "GDP per capita is a country's gross domestic product divided by its population. This data is adjusted for inflation and differences in living costs between countries."
                        variantName: "World Bank, constant international-$"
                        type: "chart"
                        availableEntities:
                          - "United States"
                          - "China"
                          - "India"
                        originalAvailableEntities:
                          - "Bosnia and Herzegovina"
                          - "United States"
                          - "China"
                          - "India"
                        availableTabs:
                          - "LineChart"
                          - "Table"
                          - "WorldMap"
                        publishedAt: "2016-05-03T21:44:14.000Z"
                        updatedAt: "2025-12-20T15:23:24.000Z"
                        url: "https://ourworldindata.org/grapher/gdp-per-capita-worldbank"
                    nbHits: 360
                    page: 0
                    nbPages: 18
                    hitsPerPage: 20

                pageSearch:
                  summary: Page search
                  x-schema-ref: "#/components/schemas/PageSearchResponse"
                  x-request-params:
                    q: "climate change"
                    type: "pages"
                  value:
                    query: "climate change"
                    results:
                      - type: "article"
                        slug: "climate-change-support"
                        title: "More people care about climate change than you think"
                        content: |-
                          You’ll get more clicks by making people angry at others for disagreeing. “Both sides” debates, for example in talk shows, can also give people the impression that they accurately reflect balance among the public. People think that far more people are opposed to climate action as a result.The debate is now about the merits of different solutions, not whether we should actFor decades, the world debated whether climate change was happening, if humans were causing it, and if we should do something. If you look at levels of concern in the UK since the millennium, for example, you find an interesting decline-then-rise. In the first decade of the 2000s, environmental concerns were very high. In 2005/06, 82% of Brits said they were concerned about “global warming”. This was around the time that Al Gore’s film An Inconvenient Truth was released. The Stern Report on the impacts and economics of climate change was published. And not far ahead of the release of the UK’s Climate Change Act.
                        date: "2024-03-25T10:48:30.000Z"
                        modifiedDate: "2024-03-25T10:48:41.000Z"
                        thumbnailUrl: "https://ourworldindata.org/cdn-cgi/imagedelivery/qLq-8BTgXU8yG0N6HnOy8g/e5956f18-560f-4639-ad7e-c18553856600/w=512"
                        authors:
                          - "Hannah Ritchie"
                        url: "https://ourworldindata.org/climate-change-support"
                    nbHits: 104
                    offset: 0
                    length: 20
                topicSearch:
                  summary: Topic recommendations
                  x-schema-ref: "#/components/schemas/PageSearchResponse"
                  x-request-params:
                    q: "gdp"
                    type: "topics"
                  value:
                    query: "gdp"
                    results:
                      - type: "topic-page"
                        slug: "economic-growth"
                        title: "Economic Growth"
                        content: "On this page, you can find all our data, visualizations, and writing on the topic."
                        date: "2023-07-14T11:37:00.000Z"
                        modifiedDate: "2026-06-19T18:14:04.000Z"
                        thumbnailUrl: "https://ourworldindata.org/cdn-cgi/imagedelivery/qLq-8BTgXU8yG0N6HnOy8g/217caa41-002d-4436-52d9-a51501c42300/w=512"
                        authors:
                          - "Max Roser"
                          - "Bertha Rohenkohl"
                        url: "https://ourworldindata.org/economic-growth"
                    nbHits: 40
                    offset: 0
                    length: 20

        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid hitsPerPage parameter"
                details: "hitsPerPage must be between 1 and 100"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Internal server error"
                message: "An unexpected error occurred"

components:
  schemas:
    ChartSearchResponse:
      type: object
      description: Response object for chart search queries, containing search results and pagination metadata.
      required:
        - query
        - results
        - nbHits
        - page
        - nbPages
        - hitsPerPage
      properties:
        query:
          type: string
          description: The search query that was executed
          example: "population"
        results:
          type: array
          description: Array of chart search results
          items:
            $ref: "#/components/schemas/ChartResult"
        nbHits:
          type: integer
          description: |
            Total number of results found. Exception: when `closestMatches` is
            true this is the number of closest matches actually returned, not
            the number that exist — relaxed results come back as one
            non-paginated page (see `closestMatches`).
          example: 125
        page:
          type: integer
          description: Current page number (0-indexed)
          example: 0
        nbPages:
          type: integer
          description: Total number of pages available
          example: 7
        hitsPerPage:
          type: integer
          description: Number of results per page
          example: 20
        closestMatches:
          type: boolean
          description: |
            Present and true when the query itself had no exact match and
            these results were relaxed (Algolia's removeWordsIfNoResults),
            keeping only the tier of hits that matched the most query words.
            Absent for a normal exact-match response.

            A relaxed response is deliberately a single page: `nbPages` is 1
            and `nbHits` counts only the hits returned, so requesting a small
            `hitsPerPage`/`length` yields a correspondingly small `nbHits`
            even when more equally-ranked matches exist. Ask for a larger page
            if you want more of them; do not treat `nbHits` as a total or page
            past the first page.
          example: true
        warnings:
          type: array
          items:
            type: string
          description: |
            Present when the request carried parameters this endpoint doesn't
            read, or that the chosen `type` doesn't read. They were ignored;
            each warning names them, and says which parameters or types they
            belong to. `utm_*` tracking tags never produce a warning.
          example:
            - 'Ignored unknown parameter(s): "resultType". Valid parameters: type, q, countries, topics, requireAllCountries, datasetProducts, datasetNamespaces, datasetVersions, datasetProducers, pageTypes, page, hitsPerPage, offset, length, highlights. Use "type=pages" to search writing, "type=topics" for topic pages, "type=profiles" for country profiles, or "type=charts" for charts.'

    ChartResult:
      type: object
      description: Individual chart search result with metadata about the visualization.
      required:
        - title
        - slug
        - type
        - availableEntities
        - availableTabs
        - url
      properties:
        title:
          type: string
          description: Chart title
          example: "Life expectancy at birth"
        slug:
          type: string
          description: URL-friendly identifier for the chart
          example: "life-expectancy"
        subtitle:
          type: string
          description: Chart subtitle providing additional context
          example: "Period life expectancy at birth, measured in years"
        variantName:
          type: string
          description: Name of the chart variant (if applicable)
          example: "Default"
        titleVariant:
          type: string
          description: Variant shown next to the title (if applicable)
        chartConfigId:
          type: string
          description: ID of the chart's config, used for its thumbnail
        explorerType:
          type: string
          description: Kind of explorer, for `type=explorerView` results
        type:
          type: string
          enum:
            - chart
            - explorerView
            - multiDimView
          description: Type of visualization
          example: "chart"
        queryParams:
          type: string
          description: URL query parameters for explorer or multi-dimensional views
          example: "tab=chart&time=2020"
        availableEntities:
          type: array
          description: List of countries/entities available in this chart
          items:
            type: string
          example:
            - "United States"
            - "China"
            - "India"
        originalAvailableEntities:
          type: array
          description: Original list of entities before filtering
          items:
            type: string
          example:
            - "United States"
            - "United Kingdom"
        availableTabs:
          type: array
          description: Available visualization tabs
          items:
            type: string
            enum:
              - Table
              - WorldMap
              - LineChart
              - ScatterPlot
              - StackedArea
              - DiscreteBar
              - StackedDiscreteBar
              - SlopeChart
              - StackedBar
              - Marimekko
          example:
            - "Table"
            - "WorldMap"
            - "LineChart"
            - "SlopeChart"
            - "DiscreteBar"
            - "Marimekko"
        publishedAt:
          type: string
          format: date-time
          description: Publication date of the chart (ISO 8601 format)
          example: "2016-05-03T21:44:14.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update date of the chart (ISO 8601 format)
          example: "2025-12-20T15:23:24.000Z"
        url:
          type: string
          format: uri
          description: Full URL to access the chart
          example: "https://ourworldindata.org/grapher/life-expectancy"

    PageSearchResponse:
      type: object
      description: |
        Response object for page searches (`type=pages`), topic recommendations
        (`type=topics`) and profile searches (`type=profiles`), containing
        search results and pagination metadata.
        `closestMatches` is never set on a `type=topics` response.
      required:
        - query
        - results
        - nbHits
        - offset
        - length
      properties:
        query:
          type: string
          description: The search query that was executed
          example: "climate change"
        results:
          type: array
          description: Array of page search results
          items:
            $ref: "#/components/schemas/PageResult"
        nbHits:
          type: integer
          description: |
            Total number of results found. Exception: when `closestMatches` is
            true this is the number of closest matches actually returned, not
            the number that exist — relaxed results come back as one
            non-paginated page (see `closestMatches`).
          example: 42
        offset:
          type: integer
          description: Current offset in the result set
          example: 0
        length:
          type: integer
          description: Number of results returned
          example: 20
        closestMatches:
          type: boolean
          description: |
            Present and true when the query itself had no exact match and
            these results were relaxed (Algolia's removeWordsIfNoResults),
            keeping only the tier of hits that matched the most query words.
            Absent for a normal exact-match response.

            A relaxed response is deliberately a single page: `nbPages` is 1
            and `nbHits` counts only the hits returned, so requesting a small
            `hitsPerPage`/`length` yields a correspondingly small `nbHits`
            even when more equally-ranked matches exist. Ask for a larger page
            if you want more of them; do not treat `nbHits` as a total or page
            past the first page.
          example: true
        warnings:
          type: array
          items:
            type: string
          description: |
            Present when the request carried parameters this endpoint doesn't
            read, or that the chosen `type` doesn't read. They were ignored;
            each warning names them, and says which parameters or types they
            belong to. `utm_*` tracking tags never produce a warning.
          example:
            - 'Ignored unknown parameter(s): "resultType". Valid parameters: type, q, countries, topics, requireAllCountries, datasetProducts, datasetNamespaces, datasetVersions, datasetProducers, pageTypes, page, hitsPerPage, offset, length, highlights. Use "type=pages" to search writing, "type=topics" for topic pages, "type=profiles" for country profiles, or "type=charts" for charts.'

    PageResult:
      type: object
      description: Individual page/article search result with metadata about the content.
      required:
        - title
        - slug
        - type
        - url
      properties:
        title:
          type: string
          description: Page title
          example: "CO₂ emissions"
        slug:
          type: string
          description: URL-friendly identifier for the page
          example: "co2-emissions"
        type:
          type: string
          enum:
            - article
            - topic-page
            - fragment
            - linear-topic-page
            - data-insight
            - homepage
            - about-page
            - author
            - announcement
            - profile
          description: Type of page content
          example: "article"
        thumbnailUrl:
          type: string
          format: uri
          description: URL to page thumbnail image
          example: "https://ourworldindata.org/images/co2-thumbnail.jpg"
        date:
          type: string
          format: date-time
          description: Publication of the article (ISO 8601 format)
          example: "2024-09-30T08:57:00.000Z"
        modifiedDate:
          type: string
          format: date-time
          description: Last update date (ISO 8601 format)
          example: "2025-08-21T15:57:34.000Z"
        content:
          type: string
          description: Excerpt or snippet of page content
          example: "Carbon dioxide emissions are the primary driver of global climate change..."
        excerpt:
          type: string
          description: |
            The page's short summary. Returned for topic pages, profiles, and
            for `type=pages` when `q` is empty.
        excerptLong:
          type: array
          items:
            type: string
          description: The topic page's longer summary, as paragraphs (`type=topics` only)
        availableEntities:
          type: array
          items:
            type: string
          description: The countries a profile covers (`type=profiles` only)
        authors:
          type: array
          description: List of page authors
          items:
            type: string
          example:
            - "Hannah Ritchie"
            - "Max Roser"
        url:
          type: string
          format: uri
          description: Full URL to access the page
          example: "https://ourworldindata.org/co2-emissions"

    Error:
      type: object
      description: Error response object returned when a request fails.
      required:
        - error
      properties:
        error:
          type: string
          description: Error type or category
          example: "Invalid parameter"
        details:
          type: string
          description: Detailed error message
          example: "Page must be between 0 and 1000"

tags:
  - name: Search
    description: Search endpoints for charts and pages
