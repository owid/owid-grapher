# Worktree hooks for Orca (https://orca.computer), which drives a worktree per task.
#
# `setup` runs once when Orca creates a worktree; `archive` runs when it removes
# one. The archive hook matters here because `make up.worktree` starts the admin
# server and vite in a *detached* tmux session on purpose — it has to survive the
# agent that started it — so nothing except `make down.worktree` ever stops it.
# Without this, every worktree you finish leaves ~2 GB of dev servers running.
#
# Orca ignores this file unless the repo's hook command source policy allows shared
# scripts (Settings → the repo → Hooks); with "local only", your machine's own hook
# settings win instead. Available in both scripts: $ORCA_ROOT_PATH (the main
# checkout), $ORCA_WORKTREE_PATH, $ORCA_WORKSPACE_NAME.
#
# The agent waits for setup because it will usually run `make up.worktree`, and
# the dev servers crash on startup if `yarn install` is still running. Orca reads
# this key regardless of the command source policy above.
setupAgentStartupPolicy: wait-for-setup
scripts:
  setup: |
    make setup.worktree
    yarn install
  archive: |
    make down.worktree
