approvedGitRepositories: []

compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

logFilters:
  - code: YN0013
    level: discard

nmMode: hardlinks-global

nodeLinker: node-modules

npmMinimalAgeGate: 72h

# @pydantic/genai-prices is the LLM price table, re-released whenever a provider
# changes prices; the age gate would only make cost estimates lag behind them.
npmPreapprovedPackages:
  - "@pydantic/genai-prices"

# TypeDoc (used to generate the grapher package's API reference) cannot run on
# TypeScript 7 / tsgo, which is what the repo is pinned to. Turning its
# `typescript` peer dependency into a real dependency makes yarn install a
# TypeScript 5 copy *nested* under typedoc, so it never shadows the root
# TypeScript 7 for anything else — in particular not for tsdown's declaration
# build, which needs tsgo.
packageExtensions:
  typedoc@*:
    dependencies:
      typescript: ^6.0.3

plugins:
  - path: .yarn/plugins/plugin-readme-in-version.cjs
    spec: "plugin-readme-in-version"
